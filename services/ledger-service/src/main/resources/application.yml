spring:
  application:
    name: ledger-service

  datasource:
    url: ${LEDGER_DB_URL:jdbc:postgresql://localhost:5433/ledger_db}
    username: ${LEDGER_DB_USERNAME:ledger_user}
    password: ${LEDGER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      probes:
        enabled: true