services:
  postgres:
    image: postgres:18-alpine
    container_name: payment-platform-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: platform_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD}
      LEDGER_DB_PASSWORD: ${LEDGER_DB_PASSWORD}
      PROVIDER_DB_PASSWORD: ${PROVIDER_DB_PASSWORD}
      RECONCILIATION_DB_PASSWORD: ${RECONCILIATION_DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infrastructure/docker/postgres/sql:/postgres-sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_admin -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
